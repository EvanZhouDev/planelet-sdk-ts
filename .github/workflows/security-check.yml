name: Security checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.23.4, 24.22.1, 26.12.1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install verified patched Bun
        run: node scripts/install-secure-bun.mjs "$RUNNER_TEMP/planelet-secure-bun"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun audit
      - name: Check Gemini example
        working-directory: examples/gemini
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun audit
